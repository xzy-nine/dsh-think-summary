# dsh-think-summary bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over the profile root; activate with
#   dsh plugin --profile <name> add link:<repo-path>   # local dev (symlink)
#   dsh plugin --profile <name> add dsh-think-summary   # published npm package
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process, and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client") load in the web GUI.
- insert:
    - id: think-summary
      name: 'dsh-think-summary'
